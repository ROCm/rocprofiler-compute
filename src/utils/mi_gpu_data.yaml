# --------------------------------------------------------------------------------
#
# This yaml file tracks MI gpu data in a tree structure
# MI GPUs
#   |-- series: the specific MI series; mi50, mi100, mi200, mi300
#       |-- architecture: currently, only mi300 gpus hold different architectures
#           |-- models
#               |-- chip_ids: chip id is specific to the environment the gpu is being used on
#               |-- mi300_arch: mi300 specific architectures; mi300a, mi300x
#                   |-- partition_mode: currently, only mi300 gpus hold partition mode information
#                                       two types: compute partition mode, memory partition mode,
#                                       currently only mi300 gpus contains compute partition mode information on number of xcds
#
# --------------------------------------------------------------------------------

mi_gpu_data:
  - gpu_series: "mi50"
    gpu_archs:
      - gpu_arch: "gfx906"
        models:
          - gpu_model: "mi50"
            mi300_arch:
              architecture: null
              partition_mode: null
            chip_ids:
              local: null
          - gpu_model: "mi60"
            mi300_arch:
              architecture: null
              partition_mode: null
            chip_ids:
              local: null

  - gpu_series: "mi100"
    gpu_archs:
      - gpu_arch: "gfx908"
        models:
          - gpu_model: "mi100"
            mi300_arch:
              architecture: null
              partition_mode: null
            chip_ids:
              local: null

  - gpu_series: "mi200"
    gpu_archs:
      - gpu_arch: "gfx90a"
        models:
          - gpu_model: "mi210"
            mi300_arch:
              architecture: null
              partition_mode: null
            chip_ids:
              local: null
          - gpu_model: "mi250"
            mi300_arch:
              architecture: null
              partition_mode: null
            chip_ids:
              local: null
          - gpu_model: "mi250X"
            mi300_arch:
              architecture: null
              partition_mode: null
            chip_ids:
              local: null

  - gpu_series: "mi300"
    gpu_archs:
      - gpu_arch: "gfx940"
        models:
          - gpu_model: "mi300A_A0"
            mi300_arch:
              architecture: "mi300a"
              partition_mode:
                compute_partition_mode:
                  num_xcds:
                    spx: 6
                    tpx: 2
                    dpx: null
                    qpx: null
                    cpx: null
            chip_ids:
              local: null

      - gpu_arch: "gfx941"
        models:
          - gpu_model: "mi300x_a0"
            mi300_arch:
              architecture: "mi300x"
              partition_mode:
                compute_partition_mode:
                  num_xcds:
                    spx: 8
                    tpx: null
                    dpx: 4
                    qpx: 2
                    cpx: 2
            chip_ids:
              local: null

      - gpu_arch: "gfx942"
        models:
          - gpu_model: "mi300a_a1"
            mi300_arch:
              architecture: "mi300a"
              partition_mode:
                compute_partition_mode:
                  num_xcds:
                    spx: 6
                    tpx: 2
                    dpx: null
                    qpx: null
                    cpx: null
            chip_ids:
              local: 29856

          - gpu_model: "mi300x_a1"
            mi300_arch:
              architecture: "mi300x"
              partition_mode:
                compute_partition_mode:
                  num_xcds:
                    spx: 8
                    tpx: null
                    dpx: 4
                    qpx: 2
                    cpx: 2
            chip_ids:
              local: 29857

          - gpu_model: "mi308x"
            mi300_arch:
              architecture: "mi308x"
              partition_mode:
                compute_partition_mode:
                  num_xcds:
                    spx: 4
                    tpx: null
                    dpx: 2
                    qpx: null
                    cpx: 1
            chip_ids:
              local: 29858
